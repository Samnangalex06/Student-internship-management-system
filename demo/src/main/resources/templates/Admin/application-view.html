<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Application Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell bg-dark text-light">

<!-- Admin Navbar -->
<div th:replace="~{fragments/admin-nav :: adminNav}"></div>

<div class="container app-content mt-4">
  <div class="glass p-4 rounded-3 shadow-sm bg-dark bg-opacity-75">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">Application Details</h3>
        <div class="small text-muted">
          View internship application information
        </div>
      </div>

      <!-- Status badge -->
      <span th:switch="${application.status}">
        <span th:case="'PENDING'" class="badge bg-warning fs-6">PENDING</span>
        <span th:case="'APPROVED'" class="badge bg-success fs-6">APPROVED</span>
        <span th:case="'REJECTED'" class="badge bg-danger fs-6">REJECTED</span>
        <span th:case="*" class="badge bg-secondary fs-6">UNKNOWN</span>
      </span>
    </div>

    <hr class="border-secondary opacity-50 my-4">

    <!-- DETAILS TABLE -->
    <div class="table-responsive">
      <table class="table table-dark table-striped align-middle">
        <tbody>
          <tr>
            <th style="width: 30%">Application ID</th>
            <td th:text="${application.id}"></td>
          </tr>

          <tr>
            <th>Student</th>
            <td th:text="${student != null ? student.fullName : '—'}"></td>
          </tr>

          <tr>
            <th>Student Email</th>
            <td th:text="${student != null ? student.email : '—'}"></td>
          </tr>

          <tr>
            <th>Company</th>
            <td th:text="${company != null ? company.name : '—'}"></td>
          </tr>

          <tr>
            <th>Company Address</th>
            <td th:text="${company != null ? company.address : '—'}"></td>
          </tr>

          <tr>
            <th>Supervisor</th>
            <td th:text="${supervisor != null ? supervisor.fullName : '—'}"></td>
          </tr>

          <tr>
            <th>Supervisor Email</th>
            <td th:text="${supervisor != null ? supervisor.email : '—'}"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ACTIONS -->
    <div class="d-flex justify-content-between mt-4">
      <a th:href="@{/admin/applications}" class="btn btn-outline-light">
        ← Back
      </a>

      <div class="d-flex gap-2">
        <button class="btn btn-success" disabled>Approve</button>
        <button class="btn btn-danger" disabled>Reject</button>
      </div>
    </div>

  </div>
</div>

</body>
</html>
