<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>All Applications</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell bg-dark text-light">

<!-- Admin Navigation -->
<div th:replace="fragments/admin-nav :: adminNav"></div>

<div class="container app-content mt-4">
  <div class="glass p-4 rounded-3 shadow-sm bg-dark bg-opacity-75">

    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h3 class="mb-1">Applications</h3>
        <div class="small text-muted">
          View all internship applications (read-only)
        </div>
      </div>
    </div>

    <hr class="border-secondary opacity-50 my-4">

    <div class="table-responsive">
      <table class="table table-dark table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Student </th>
            <th>Company </th>
            <th>Status</th>
            <th>Supervisor </th>
          </tr>
        </thead>

        <tbody>

        <!-- Empty -->
        <tr th:if="${applications == null or #lists.isEmpty(applications)}">
          <td colspan="5" class="text-center text-muted py-4">
            No applications found
          </td>
        </tr>

        <!-- Applications -->
        <tr th:each="a : ${applications}">
          <td th:text="${a.id}"></td>
          <td th:text="${a.studentId}"></td>
          <td th:text="${a.companyId}"></td>

          <td>
            <span class="badge bg-secondary"
                  th:text="${a.status}">
            </span>
          </td>

          <td th:text="${a.supervisorId != null ? a.supervisorId : '—'}"></td>
        </tr>

        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
