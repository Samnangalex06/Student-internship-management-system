  <!DOCTYPE html>
  <html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>All Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
  </head>

  <body class="app-shell bg-dark text-light">

  <!-- Admin Navigation -->
  <div th:replace="fragments/admin-nav :: adminNav"></div>

  <div class="container app-content mt-4">
    <div class="glass p-4 rounded-3 shadow-sm bg-dark bg-opacity-75">

      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h3 class="mb-1">Applications</h3>
          <div class="small text-muted">
            View all internship applications (read-only)
          </div>
        </div>
      </div>

      <hr class="border-secondary opacity-50 my-4">

  <div class="table-responsive">
    <table class="table table-dark table-striped table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Student</th>
          <th>Company</th>
          <th>Status</th>
          <th>Supervisor</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${applications == null or #lists.isEmpty(applications)}">
          <td colspan="6" class="text-center text-muted py-4">No applications found</td>
        </tr>
        <tr th:each="app : ${applications}">
          <td th:text="${app.id}"></td>
          <td th:text="${app.studentName}"></td>
          <td th:text="${app.companyName}"></td>
         <td>
  <span th:switch="${app.status}">
    <span th:case="'PENDING'" class="badge bg-warning">PENDING</span>
    <span th:case="'APPROVED'" class="badge bg-success">APPROVED</span>
    <span th:case="'REJECTED'" class="badge bg-danger">REJECTED</span>
    <span th:case="*" class="badge bg-secondary">UNKNOWN</span>
  </span>
</td>

          <td th:text="${app.supervisorName}"></td>
          <td><a th:href="@{/admin/applications/{id}(id=${app.id})}"
   class="btn btn-sm btn-primary">
  View
</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
