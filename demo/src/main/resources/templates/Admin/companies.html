<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Companies</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
  </head>

  <body class="app-shell">
    <!-- ✅ ADMIN NAVBAR (THIS WAS MISSING) -->
    <div th:replace="~{fragments/admin-nav :: adminNav}"></div>

    <div class="container app-content">
      <div class="glass p-4">
        <!-- Header -->
        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div>
            <h2 class="mb-1">Companies</h2>
            <div class="small-muted">
              Manage registered internship companies
            </div>
          </div>

          <a
            class="btn btn-primary btn-sm"
            th:href="@{/admin/companies/create}"
          >
            + Add Company
          </a>
        </div>

        <hr class="border-light opacity-10 my-4" />

        <!-- Empty state -->
        <div
          th:if="${companies == null || #lists.isEmpty(companies)}"
          class="alert alert-dark border-0"
          style="background: rgba(255, 255, 255, 0.06)"
        >
          No companies found.
        </div>

        <!-- Companies table -->
        <div
          class="table-responsive"
          th:if="${companies != null && !#lists.isEmpty(companies)}"
        >
          <table
            class="table table-dark table-darkish table-striped table-hover align-middle"
          >
            <thead>
              <tr>
                <th>#</th>
                <th>Company Name</th>
                <th>Phone</th>
                <th>Address</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="c, stat : ${companies}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${c.name}">Company Name</td>
                <td th:text="${c.phoneNumber}">012345678</td>
                <td th:text="${c.address}">Address here</td>

                <td class="text-end">
                  <a
                    class="btn btn-outline-light btn-sm"
                    th:href="@{/admin/companies/edit/{id}(id=${c.id})}"
                  >
                    Edit
                  </a>

                  <form
                    th:action="@{/admin/companies/delete/{id}(id=${c.id})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Delete this company?')"
                  >
                    <button class="btn btn-danger btn-sm">Delete</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
