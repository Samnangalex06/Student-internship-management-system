<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Company Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
  </head>

  <body class="app-shell">
    <div th:replace="~{fragments/admin-nav :: adminNav}"></div>

    <div class="container app-content">
      <div class="glass p-4">
        <h2
          class="mb-3"
          th:text="${company.id == null ? 'Add Company' : 'Edit Company'}"
        >
          Company Form
        </h2>

        <form
          th:action="${company.id == null}
                     ? @{/admin/companies/create}
                     : @{/admin/companies/edit/{id}(id=${company.id})}"
          th:object="${company}"
          method="post"
        >
          <!-- Company Name -->
          <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input class="form-control" th:field="*{name}" required />
          </div>

          <!-- Phone Number -->
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input class="form-control" th:field="*{phoneNumber}" required />
          </div>

          <!-- ✅ NEW: Company Address -->
          <div class="mb-3">
            <label class="form-label">Company Address</label>
            <textarea
              class="form-control"
              th:field="*{address}"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-light" th:href="@{/admin/companies}">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
