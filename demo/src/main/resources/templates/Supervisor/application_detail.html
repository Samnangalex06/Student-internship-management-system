<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .info-box {
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 12px;
        }

        .action-bar {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 16px;
            margin-top: 16px;
        }
    </style>
</head>

<body class="app-shell">

<!-- Supervisor Navigation -->
<div th:replace="fragments/supervisor-nav :: SupervisorNv"></div>

<div class="container app-content mt-4">
    <div class="glass p-4">

        <!-- Back -->
        <a th:href="@{/supervisor/approvals}"
           class="btn btn-sm btn-outline-light mb-3">
            <i class="bi bi-arrow-left"></i> Back
        </a>

        <!-- Title -->
        <h4 th:text="${applicationView.title}"></h4>

        <!-- Student / Company -->
        <div class="small-muted mb-3">
            <i class="bi bi-person me-1"></i>
            <span th:text="${applicationView.studentName}"></span>
            &nbsp;•&nbsp;
            <i class="bi bi-building me-1"></i>
            <span th:text="${applicationView.companyName}"></span>
        </div>

        <!-- Info boxes -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="info-box">
                    <div class="small-muted">Status</div>
                    <span class="badge bg-warning fs-6 mt-1"
                          th:text="${applicationView.status}">
                    </span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="info-box">
                    <div class="small-muted">Submitted</div>
                    <div class="fw-semibold"
                         th:text="${#temporals.format(applicationView.createdAt,'dd MMM yyyy – HH:mm')}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <div class="small-muted fw-semibold mb-1">Description</div>
            <div class="info-box" style="white-space: pre-wrap;"
                 th:text="${applicationView.description}">
            </div>
        </div>

        <!-- Documents -->
        <div th:if="${documents != null && !#lists.isEmpty(documents)}" class="mb-3">
            <h6>Documents</h6>
            <ul class="list-group">
                <li class="list-group-item bg-transparent text-white
                           d-flex justify-content-between align-items-center"
                    th:each="doc : ${documents}">
                    <span th:text="${doc.fileName}"></span>
                    <a th:href="@{|/${doc.filePath}|}"
                       th:attr="download=${doc.fileName}"
                       class="btn btn-sm btn-outline-info">
                        Download
                    </a>
                </li>
            </ul>
        </div>

        <div th:if="${documents == null || #lists.isEmpty(documents)}"
             class="small-muted">
            No documents uploaded.
        </div>

        <!-- Actions -->
        <div class="action-bar d-flex gap-2">
            <form th:action="@{/supervisor/applications/{id}/accept(id=${applicationView.id})}"
                  method="post">
                <button class="btn btn-success btn-sm">
                    <i class="bi bi-check-circle-fill me-1"></i> Approve
                </button>
            </form>

            <form th:action="@{/supervisor/applications/{id}/reject(id=${applicationView.id})}"
                  method="post">
                <button class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-x-circle me-1"></i> Reject
                </button>
            </form>
            <!-- <form th:action="@{/supervisor/applications/{id}/delete(id=${applicationView.id})}"
                method="post"
                onsubmit="return confirm('Are you sure you want to delete this application?');">
                <button class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash-fill me-1"></i> Delete
                </button>
            </form> -->
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
