<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<!-- Supervisor Navigation -->
<div th:replace="fragments/supervisor-nav :: SupervisorNv"></div>

<div class="container mt-4">
    <div class="glass p-4">

        <!-- Back Button -->
        <a th:href="@{/supervisor/app_view}" class="btn btn-sm btn-outline-light mb-3">
            <i class="bi bi-arrow-left"></i> Back
        </a>

        <!-- Application Title -->
        <h4 th:text="${application.title}"></h4>

        <!-- Student & Company Info -->
        <div class="small-muted mb-2">
            <i class="bi bi-person me-1"></i>
            <span th:text="${application.studentName}"></span>
            &nbsp;•&nbsp;
            <i class="bi bi-building me-1"></i>
            <span th:text="${application.companyName}"></span>
        </div>

        <hr>

        <!-- Application Description -->
        <p th:text="${application.description}"></p>

        <!-- Documents -->
        <h6>Documents</h6>
        <ul class="list-group mb-3">
            <li th:each="doc : ${documents}"
                class="list-group-item bg-transparent text-white d-flex justify-content-between">
                <span th:text="${doc.fileName}"></span>
                <a th:href="@{/files/{file}(file=${doc.filePath})}"
                   th:attr="download=${doc.fileName}"
                   class="btn btn-sm btn-outline-info">
                    Download
                </a>
            </li>
        </ul>

    </div>
</div>

</body>
</html>
