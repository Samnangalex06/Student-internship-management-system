<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supervisor Approvals</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* LEFT PANEL */
        .app-item {
            background: transparent;
            border-radius: 10px;
            padding: 8px 12px;
            transition: background 0.15s ease, border-left 0.15s ease;
            border-left: 3px solid transparent;
        }

        a:hover .app-item {
            background: rgba(255,255,255,0.08);
        }

        .app-item.active {
            background: rgba(13,110,253,0.25);
            border-left-color: #0d6efd;
        }

        a:hover .app-item.active {
            background: rgba(13,110,253,0.32);
        }

        /* RIGHT PANEL */
        .info-box {
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 12px;
        }

        .action-bar {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 16px;
            margin-top: 16px;
        }
    </style>
</head>

<body class="app-shell">

<div th:replace="fragments/supervisor-nav :: SupervisorNv"></div>

<div class="container app-content mt-4">
    <div class="row g-4">

        <!-- LEFT PANEL -->
        <div class="col-lg-4 col-md-5">
            <div class="glass p-3 h-100">
                <h5 class="mb-3">Pending Applications</h5>

                <div class="d-flex flex-column gap-2">
                    <a th:each="app : ${pendingApplications}"
                       th:href="@{/supervisor/approvals(id=${app.id})}"
                       class="text-decoration-none text-white">
                        <div class="app-item"
                             th:classappend="${selectedApplication != null && selectedApplication.id == app.id} ? ' active'">
                            <div class="d-flex justify-content-between">
                                <h6 class="mb-1 text-truncate" th:text="${app.title}"></h6>
                                <span class="badge bg-warning" th:text="${app.status}"></span>
                            </div>
                            <div class="small">
                                <i class="bi bi-person-fill me-1"></i>
                                <span th:text="${app.studentName}"></span>
                            </div>
                            <div class="d-flex justify-content-between small-muted mt-1">
                                <span>
                                    <i class="bi bi-building me-1"></i>
                                    <span th:text="${app.companyName}"></span>
                                </span>
                                <span th:text="${#temporals.format(app.createdAt,'dd MMM')}"></span>
                            </div>
                        </div>
                    </a>

                    <div th:if="${#lists.isEmpty(pendingApplications)}"
                         class="text-center py-5 small-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-3 opacity-50"></i>
                        No pending applications
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="col-lg-8 col-md-7">
            <div class="glass p-4 h-100">

                <div th:if="${selectedApplication != null}">
                    <h5 class="mb-3">Application Details</h5>
                    <h4 th:text="${selectedApplication.title}"></h4>
                    <div class="small-muted mb-2">
                        <i class="bi bi-person me-1"></i>
                        <span th:text="${selectedApplication.studentName}"></span>
                        &nbsp;•&nbsp;
                        <i class="bi bi-building me-1"></i>
                        <span th:text="${selectedApplication.companyName}"></span>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="info-box">
                                <div class="small-muted">Status</div>
                                <span class="badge bg-warning fs-6 mt-1" th:text="${selectedApplication.status}"></span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-box">
                                <div class="small-muted">Submitted</div>
                                <div class="fw-semibold"
                                     th:text="${#temporals.format(selectedApplication.createdAt,'dd MMM yyyy – HH:mm')}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="small-muted fw-semibold mb-1">Description</div>
                        <div class="info-box" style="white-space: pre-wrap;"
                             th:text="${selectedApplication.description}">
                        </div>
                    </div>

                    <!-- Documents -->
                    <div th:if="${documents != null && !#lists.isEmpty(documents)}" class="mb-3">
                        <h6>Documents</h6>
                        <ul class="list-group">
                            <li class="list-group-item bg-transparent text-white d-flex justify-content-between align-items-center"
                                th:each="doc : ${documents}">
                                <span th:text="${doc.fileName}"></span>
                                <a th:href="@{${doc.filePath}}" class="btn btn-sm btn-outline-info">Download</a>
                            </li>
                        </ul>
                    </div>
                    <div th:if="${documents == null || #lists.isEmpty(documents)}" class="small-muted">
                        No documents uploaded.
                    </div>

                    <!-- Actions -->
                    <div class="action-bar d-flex gap-2">
                        <form th:action="@{/supervisor/applications/{id}/accept(id=${selectedApplication.id})}" method="post">
                            <button class="btn btn-success btn-sm"><i class="bi bi-check-circle-fill me-1"></i>Approve</button>
                        </form>
                        <form th:action="@{/supervisor/applications/{id}/reject(id=${selectedApplication.id})}" method="post">
                            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-x-circle me-1"></i>Reject</button>
                        </form>
                    </div>

                </div>

                <div th:unless="${selectedApplication != null}" class="text-center py-5 mt-5">
                    <i class="bi bi-arrow-left-circle fs-1 opacity-50 mb-3 d-block"></i>
                    <h5 class="text-muted">Select an application</h5>
                    <p class="small-muted">Choose an application from the left panel to review</p>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
