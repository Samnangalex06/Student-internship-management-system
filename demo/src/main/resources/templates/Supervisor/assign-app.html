<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

    <!-- Supervisor Navigation -->
    <div th:replace="~{fragments/supervisor-nav :: SupervisorNv}"></div>

    <div class="container app-content mt-4">

        <!-- Header -->
        <div class="glass p-4 mb-4">
            <h3 class="mb-1">Pending Applications</h3>
            <div class="small-muted">Assign a company and approve applications</div>
        </div>

        <!-- Table -->
        <div class="glass p-4">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Assign Company</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop over pending applications -->
                    <tr th:each="app : ${applications}">
                        <td th:text="${app.id}">1</td>
                        <td th:text="${app.student?.fullName}">Student Name</td>
                        <td th:text="${app.title}">Application Title</td>
                        <td th:text="${app.description}">Application Description</td>

                        <!-- Company assignment dropdown -->
                        <td>
                            <form th:action="@{/supervisor/assign-app}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="applicationId" th:value="${app.id}" />
                                <select name="companyId" class="form-select" required>
                                    <option value="">Select company</option>
                                    <option th:each="c : ${companies}" 
                                            th:value="${c.id}" 
                                            th:text="${c.name}">
                                    </option>
                                </select>
                        </td>

                        <!-- Assign & Approve button -->
                        <td>
                                <button type="submit" class="btn btn-success btn-sm"
                                        th:disabled="${app.status != 'PENDING'}">
                                    Assign & Approve
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- If no pending applications -->
                    <tr th:if="${#lists.isEmpty(applications)}">
                        <td colspan="6" class="text-center small-muted">
                            No pending applications
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
