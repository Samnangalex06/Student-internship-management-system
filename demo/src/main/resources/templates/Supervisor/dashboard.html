<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supervisor Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">
     <div th:replace="fragments/supervisor-nav :: SupervisorNv"></div>
<div class="container app-content mt-4">
   

    <div class="glass p-4 mb-4">
        <h3 class="mb-1">Welcome
            <span th:text="${supervisor.fullName}">Supervisor</span>
        </h3>
        <div class="small-muted">Supervisor dashboard overview</div>
    </div>

    <div class="row g-3 mb-4">

        <div class="col-md-4">
            <div class="glass p-3 text-center">
                <div class="fs-3 fw-bold" th:text="${applicationCount}">0</div>
                <div class="small-muted">Total Applications</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="glass p-3 text-center">
                <div class="fs-6 fw-bold" th:text="${latestStatus}">No applications</div>
                <div class="small-muted">Latest Status</div>
            </div>
        </div>

    </div>

   <div class="glass p-4">
    <h5 class="mb-3">Recent Applications</h5>

    <table class="table table-dark table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Company</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${recentApplications}">
            <td th:text="${app.id}">1</td>
            <td th:text="${companyMap[app.companyId]}">Company</td>
            <td th:text="${app.status}">Pending</td>

            <td th:text="${#temporals.format(app.createdAt, 'dd MMM yyyy')}">Date</td>
            <td class="d-flex gap-2">

                <!-- View button -->
                <a class="btn btn-outline-info btn-sm"
                   th:href="@{/supervisor/applications/view/{id}(id=${app.id})}">
                    View
                </a>

                

                <!-- Reject button -->
                <form th:action="@{/supervisor/applications/{id}/reject(id=${app.id})}" method="post">
                    <button class="btn btn-danger btn-sm"
                            type="submit"
                            th:disabled="${app.status != T(project.demo.entity.Application.ApplicationStatus).PENDING}">
                        Reject
                    </button>
                </form>

            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(recentApplications)}">
            <td colspan="5" class="text-center small-muted">
                No applications yet
            </td>
        </tr>
        </tbody>
    </table>
</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
