<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Evaluation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<!-- Supervisor Navigation -->
<div th:replace="~{fragments/supervisor-nav :: SupervisorNv}"></div>

<div class="container app-content mt-4">

    <!-- Header -->
    <div class="glass p-4 mb-4">
        <h3 class="mb-1">Pending Applications</h3>
        <div class="small-muted">Evaluation & Comments</div>
    </div>

    <!-- Table -->
    <div class="glass p-4">
        <table class="table table-dark table-hover align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Title</th>
                <th>Description</th>
                <th>Company</th>
                <th>Latest Evaluation</th>
                <th>New Evaluation</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="app : ${applications}">
                <form th:action="@{/supervisor/evaluation}" method="post">

                    <!-- Hidden ID -->
                    <input type="hidden" name="applicationId" th:value="${app.id}" />

                    <td th:text="${app.id}"></td>
                    <td th:text="${app.student?.fullName}"></td>
                    <td th:text="${app.title}"></td>
                    <td th:text="${app.description}"></td>

                    <!-- Company -->
                    <td>
                        <span th:text="${app.company?.name}">Company</span>
                    </td>

                    <!-- EXISTING evaluation -->
                    <td>
                        <div th:if="${!#lists.isEmpty(evaluationsMap[app.id])}">
                            <strong>Score:</strong>
                            <span th:text="${evaluationsMap[app.id][0].score}"></span><br>

                            <strong>Comment:</strong>
                            <span th:text="${evaluationsMap[app.id][0].comment}"></span>
                        </div>

                        <span th:if="${#lists.isEmpty(evaluationsMap[app.id])}">
                            No evaluation yet
                        </span>
                    </td>

                    <!-- NEW evaluation -->
                    <td>
                        <textarea name="comment"
                                  class="form-control mb-2"
                                  rows="2"
                                  placeholder="Add comment"
                                  required></textarea>

                        <input type="number"
                               name="score"
                               class="form-control"
                               min="0"
                               max="10"
                               placeholder="Score"
                               required />
                    </td>

                    <!-- Action -->
                    <td>
                        <button type="submit" class="btn btn-success btn-sm">
                            Submit
                        </button>
                    </td>

                </form>
            </tr>

            <!-- Empty state -->
            <tr th:if="${#lists.isEmpty(applications)}">
                <td colspan="8" class="text-center">
                    No pending applications
                </td>
            </tr>

            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
