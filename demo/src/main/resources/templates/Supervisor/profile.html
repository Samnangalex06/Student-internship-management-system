<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Supervisor Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">

  <style>
     .display-span {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;      /* Matches Bootstrap input padding */
        border: 1px solid #6c757d;      /* Similar to your input border-secondary */
        border-radius: 0.25rem;         /* Rounded corners */
        background-color: #343a40;      /* Dark background similar to bg-dark */
        color: #f8f9fa;                 /* Light text color similar to text-light */
        font-size: 1rem;                /* Matches Bootstrap input font */
        line-height: 1.5;
    }

    /* Optional: on hover give subtle effect */
    .display-span:hover {
        background-color: #495057;
        cursor: default;
    }
  </style>
</head>

<body class="app-shell">

<!-- Supervisor Navigation -->
<div th:replace="~{fragments/supervisor-nav :: SupervisorNv}"></div>

<div class="container app-content">
  <div class="glass p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">My Profile</h3>
        <div class="small-muted">View and update your information</div>
      </div>
      <span class="badge bg-secondary">Supervisor</span>
    </div>

    <hr class="border-light opacity-10 mb-4">

    <!-- Profile Form -->
    <form th:action="@{/supervisor/profile/save}"
          method="post"
          th:object="${supervisor}"
          class="row g-3">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{id}"/>

        <!-- Full Name -->
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <span class="display-span" th:text="*{fullName}" id="fullNameDisplay"></span>
          <input class="form-control d-none" th:field="*{fullName}" id="fullNameInput">
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label">Email Address</label>
          <span class="display-span" th:text="*{email}" id="emailDisplay"></span>
          <input type="email" class="form-control d-none" th:field="*{email}" id="emailInput">
        </div>

        <!-- Phone Number -->
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <span class="display-span" th:text="*{phoneNumber}" id="phoneDisplay"></span>
          <input type="text" class="form-control d-none" th:field="*{phoneNumber}" id="phoneInput">
        </div>

        <!-- Department -->
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <span class="display-span" th:text="*{department}" id="departmentDisplay"></span>
          <input class="form-control d-none" th:field="*{department}" id="departmentInput">
        </div>

        <!-- Buttons -->
        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary" id="editBtn">
            <i class="bi bi-pencil me-1"></i> Edit
          </button>

          <button type="submit" class="btn btn-success d-none" id="saveBtn">
            <i class="bi bi-save me-1"></i> Save
          </button>

          <button type="button" class="btn btn-secondary d-none" id="cancelBtn">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </button>
        </div>

    </form>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success mt-4">
      Profile updated successfully.
    </div>

    <div th:if="${error}" class="alert alert-danger mt-4">
      Failed to update profile.
    </div>

  </div>
</div>

<!-- JavaScript to toggle edit mode -->
<script>
  const editBtn = document.getElementById('editBtn');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  const fields = [
    {display: 'fullNameDisplay', input: 'fullNameInput'},
    {display: 'emailDisplay', input: 'emailInput'},
    {display: 'phoneDisplay', input: 'phoneInput'},
    {display: 'departmentDisplay', input: 'departmentInput'}
  ];

  editBtn.addEventListener('click', () => {
    // Hide display spans and show inputs
    fields.forEach(f => {
      document.getElementById(f.display).classList.add('d-none');
      document.getElementById(f.input).classList.remove('d-none');
    });
    editBtn.classList.add('d-none');
    saveBtn.classList.remove('d-none');
    cancelBtn.classList.remove('d-none');
  });

  cancelBtn.addEventListener('click', () => {
    // Hide inputs and show display spans
    fields.forEach(f => {
      document.getElementById(f.display).classList.remove('d-none');
      document.getElementById(f.input).classList.add('d-none');
    });
    editBtn.classList.remove('d-none');
    saveBtn.classList.add('d-none');
    cancelBtn.classList.add('d-none');
  });
</script>

</body>
</html>
