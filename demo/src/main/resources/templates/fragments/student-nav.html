<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="studentNav"
     class="navbar navbar-expand-lg navbar-dark app-nav">

  <div class="container-fluid">

    <!-- Brand -->
    <a class="navbar-brand fw-semibold" th:href="@{/student/dashboard}">
      SIMS <span class="badge badge-soft ms-2">Student</span>
    </a>

    <!-- Mobile toggle -->
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#studentNavMenu"
            aria-controls="studentNavMenu"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="studentNavMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2">

        <li class="nav-item">
          <a class="nav-link" th:href="@{/student/dashboard}">Dashboard</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/student/applications}">Applications</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/student/evaluations}">Evaluations</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/student/profile}">Profile</a>
        </li>

      </ul>

      <!-- Right -->
      <div class="d-flex">
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
          Logout
        </a>
      </div>
    </div>

  </div>
</nav>

<!-- Style -->
<style>
  .app-nav {
    background: rgba(20, 20, 30, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .badge-soft {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: #fff;
    font-size: 0.75rem;
    border-radius: 999px;
  }

  .navbar-nav .nav-link {
    color: #cfd3ff;
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    transition: all .15s ease;
  }

  .navbar-nav .nav-link:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
</style>

</body>
</html>
