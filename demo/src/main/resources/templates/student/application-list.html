<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Applications</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<!-- Student Navbar -->
<div th:replace="~{fragments/student-nav :: studentNav}"></div>

<div class="container app-content">
  <div class="glass p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="mb-1">My Applications</h2>
        <div class="small-muted">Internship submissions</div>
      </div>

      <a class="btn btn-success btn-sm"
         th:href="@{/student/applications/new}">
        New
      </a>
    </div>

    <hr class="border-light opacity-10 my-4" />

    <!-- Empty State -->
    <div th:if="${applications == null || #lists.isEmpty(applications)}">
      <div class="alert alert-dark border-0"
           style="background: rgba(255,255,255,0.06)">
        You have not submitted any applications yet.
      </div>
    </div>

    <!-- Applications Table -->
    <div class="table-responsive"
         th:if="${applications != null && !#lists.isEmpty(applications)}">

      <table class="table table-dark table-darkish table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>Description</th>
            <th>Status</th>
            <th>Company</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="a : ${applications}">
            <td th:text="${a.description}">Description</td>

            <td>
              <span class="badge badge-soft"
                    th:text="${a.status}">
                PENDING
              </span>
            </td>

            <td th:text="${companyMap.get(a.companyId) ?: 'Not assigned'}">
              Not assigned
            </td>

            <td>
              <a class="btn btn-outline-light btn-sm"
                 th:href="@{/student/applications/{id}(id=${a.id})}">
                View
              </a>
            </td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
