<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Applications</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell bg-dark text-light">

<!-- Student Navigation -->
<div th:replace="~{fragments/student-nav :: studentNav}"></div>

<div class="container app-content mt-4">
  <div class="glass p-4 rounded-3 shadow-sm bg-dark bg-opacity-75">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h3 class="mb-1">
          <i class="bi bi-list-check me-2"></i>
          My Applications
        </h3>
        <div class="small text-muted">Internship submissions</div>
      </div>

      <a class="btn btn-success btn-sm" th:href="@{/student/applications/new}">
        <i class="bi bi-plus-circle me-2"></i>New
      </a>
    </div>

    <hr class="border-secondary opacity-50 my-4">

    <!-- Applications Table -->
    <div class="table-responsive">
      <table class="table table-dark table-striped table-hover align-middle">
        <thead>
        <tr>
          <th><i class="bi bi-text-paragraph me-2"></i>Description</th>
          <th><i class="bi bi-info-circle me-2"></i>Status</th>
          <th><i class="bi bi-building me-2"></i>Company</th>
          <th><i class="bi bi-eye me-2"></i>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="a : ${applications}">
          <td th:text="${a.description}">Description</td>

          <td>
            <span class="badge bg-secondary" th:text="${a.status}">
              Status
            </span>
          </td>

          <!-- ✅ FIXED LINE -->
          <td th:text="${companyMap.get(a.companyId) ?: 'Not assigned'}">
            Company
          </td>

          <td>
            <a class="btn btn-outline-light btn-sm"
               th:href="@{/student/applications/{id}(id=${a.id})}">
              <i class="bi bi-eye"></i> View
            </a>
          </td>
        </tr>
        </tbody>

      </table>
    </div>

  </div>
</div>

</body>
</html>
