<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Evaluations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<!-- Student Navbar -->
<div th:replace="~{fragments/student-nav :: studentNav}"></div>

<div class="container mt-5">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">My Evaluations</h3>
      <small>Supervisor feedback & performance</small>
    </div>

    <div class="card-body p-4">
      <!-- No evaluations case -->
      <div th:if="${evaluations == null or #lists.isEmpty(evaluations)}" 
           class="text-center py-5">
        <i class="bi bi-info-circle-fill text-primary fs-1 mb-3"></i>
        <h5 class="text-muted mb-2">No evaluations available yet.</h5>
        <p class="text-muted small">
          Your supervisor will provide feedback after approval.
        </p>
      </div>

      <!-- Evaluations exist -->
      <div th:unless="${evaluations == null or #lists.isEmpty(evaluations)}">
        <div th:each="eval : ${evaluations}" class="card mb-4 shadow-sm border-0">
          <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <strong th:text="${eval.application?.title ?: 'Untitled Internship'}">
              Internship Title
            </strong>
            <small class="text-muted" 
                   th:text="${eval.createdAt != null} ? ${#dates.format(eval.createdAt, 'dd MMM yyyy HH:mm')} : ''">
            </small>
          </div>

          <div class="card-body">
            <!-- Scores -->
            <div class="row text-center mb-4">
              <div class="col-md-4">
                <div class="p-3 bg-light rounded">
                  <strong>Technical</strong><br>
                  <span class="fs-4 fw-bold" th:text="${eval.technicalScore} ?: '-'"></span>
                  <span class="text-muted">/ 10</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="p-3 bg-light rounded">
                  <strong>Communication</strong><br>
                  <span class="fs-4 fw-bold" th:text="${eval.communicationScore} ?: '-'"></span>
                  <span class="text-muted">/ 10</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="p-3 bg-light rounded">
                  <strong>Professionalism</strong><br>
                  <span class="fs-4 fw-bold" th:text="${eval.professionalismScore} ?: '-'"></span>
                  <span class="text-muted">/ 10</span>
                </div>
              </div>
            </div>

            <!-- Comment -->
            <h6 class="fw-bold mb-2">Supervisor Comment:</h6>
            <p class="fst-italic border-start border-primary ps-3 py-2 bg-light rounded" 
               th:text="${eval.comment} ?: 'No written comment provided'">
              Supervisor comment will appear here...
            </p>

            <!-- Supervisor info -->
            <small class="text-muted d-block mt-3">
              Evaluated by: 
              <strong th:text="${eval.supervisor?.name ?: 'Unknown Supervisor'}"></strong>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
