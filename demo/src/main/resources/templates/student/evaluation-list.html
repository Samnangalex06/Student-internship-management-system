<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Evaluations</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<!-- Student Navbar -->
<div th:replace="~{fragments/student-nav :: studentNav}"></div>

<div class="container app-content">
  <div class="glass p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="mb-1">My Evaluations</h2>
        <div class="small-muted">Supervisor feedback & performance</div>
      </div>
    </div>

    <hr class="border-light opacity-10 my-4" />

    <!-- Empty State -->
    <div th:if="${evaluations == null || #lists.isEmpty(evaluations)}">
      <div class="alert alert-dark border-0"
           style="background: rgba(255,255,255,0.06)">
        No evaluations available yet.
      </div>
    </div>

    <!-- Evaluation Table -->
    <div class="table-responsive"
         th:if="${evaluations != null && !#lists.isEmpty(evaluations)}">

      <table class="table table-dark table-darkish table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>Application</th>
            <th>Score</th>
            <th>Comment</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="e : ${evaluations}">
            <td th:text="${e.application.title}">
              Application Title
            </td>

            <td>
              <span class="badge badge-soft"
                    th:text="${e.score}">
                0
              </span>
            </td>

            <td th:text="${e.comment}">
              Comment
            </td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
