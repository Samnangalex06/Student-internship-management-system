<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="app-shell">

<!-- Student Navbar -->
<div th:replace="~{fragments/student-nav :: studentNav}"></div>

<div class="container app-content">
  <div class="glass p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">My Profile</h3>
        <div class="small-muted">View and update your personal information</div>
      </div>
      <span class="badge badge-soft">Student</span>
    </div>

    <hr class="border-light opacity-10 my-4">

    <!-- Form -->
    <form th:action="@{/student/profile/save}"
          method="post"
          th:object="${student}"
          class="row g-3">

      <!-- Hidden ID -->
      <input type="hidden" th:field="*{id}">

      <!-- Full Name -->
      <div class="col-md-6">
        <label class="form-label">Full Name</label>

        <!-- View -->
        <span class="form-control profile-span view-mode"
              th:text="*{fullName}"></span>

        <!-- Edit -->
        <input class="form-control edit-mode d-none"
               th:field="*{fullName}">
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <label class="form-label">Email Address</label>

        <span class="form-control profile-span view-mode"
              th:text="*{email}"></span>

        <input type="email"
               class="form-control edit-mode d-none"
               th:field="*{email}">
      </div>

      <!-- Phone -->
      <div class="col-md-6">
        <label class="form-label">Phone Number</label>

        <span class="form-control profile-span view-mode"
              th:text="*{phoneNumber}"></span>

        <input class="form-control edit-mode d-none"
               th:field="*{phoneNumber}">
      </div>

      <!-- Buttons -->
      <div class="col-12 mt-4">

        <!-- View buttons -->
        <button type="button"
                id="editBtn"
                class="btn btn-outline-info btn-sm view-mode">
          <i class="bi bi-pencil"></i> Edit
        </button>

        <!-- Edit buttons -->
        <div class="edit-mode d-none">
          <button type="submit" class="btn btn-success btn-sm">
            <i class="bi bi-save"></i> Save
          </button>

          <button type="button"
                  id="cancelBtn"
                  class="btn btn-outline-light btn-sm ms-2">
            Cancel
          </button>
        </div>
      </div>

    </form>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success mt-4">
      Profile updated successfully.
    </div>

    <div th:if="${error}" class="alert alert-danger mt-4">
      Failed to update profile.
    </div>

  </div>
</div>

<!-- Toggle Script -->
<script>
  const editBtn = document.getElementById("editBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  editBtn?.addEventListener("click", () => {
    document.querySelectorAll(".view-mode").forEach(e => e.classList.add("d-none"));
    document.querySelectorAll(".edit-mode").forEach(e => e.classList.remove("d-none"));
  });

  cancelBtn?.addEventListener("click", () => {
    window.location.reload();
  });
</script>

</body>
</html>
